<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090c12" />
    <meta name="description" content="Music Creation Toolkit · 开源音乐创作工具箱：Tone.js、Web Audio、Python DSP、声音资产、编曲模板与 MP3/WAV 导出。" />
    <title>Music Creation Toolkit / 音乐创作工具箱</title>
    <style>
      .startup-note { max-width: 560px; margin: 18vh auto; padding: 28px; border: 1px solid #344054; border-radius: 12px; background: #131924; color: #e1e8f0; font: 16px/1.8 system-ui, sans-serif; }
      .startup-note h1 { margin: 0 0 16px; font-size: 24px; }
      .startup-note code { padding: 3px 8px; border-radius: 4px; background: #090c12; color: #d0f879; }
      .startup-note p { margin: 12px 0; }
      html:has(.startup-note) { background: #090c12; }
    </style>
  </head>
  <body>
    <div id="app">
      <section class="startup-note" role="status">
        <h1>正在打开音乐创作工具箱</h1>
        <p>如果直接打开了 index.html，请在项目目录运行 <code>npm run dev</code>，再打开终端显示的本地网址。</p>
        <p>本地文件地址无法加载音乐模块；音乐台需要通过本地服务打开。</p>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
