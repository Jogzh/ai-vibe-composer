name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-palette.txt
      - name: Install lightweight audio dependencies
        run: python -m pip install -r scripts/requirements-palette.txt
      - name: Unit tests and production build
        run: npm run check
      - name: Asset catalog and Python DSP checks
        run: |
          npm run assets:check
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/build_sound_palette.py verify
      - name: Install Chromium and system dependencies
        run: npx --no-install playwright install --with-deps chromium
      - name: Real browser audio and player checks
        run: |
          npm run test:browser
          npm run test:palette
